version: '3.9'

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gldis
      POSTGRES_PASSWORD: gldis_secret
      POSTGRES_DB: gldis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gldis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (for future Celery task queue) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j (Stage 2 — GraphRAG knowledge graph) ──────────────────────────
  neo4j:
    image: neo4j:5.15-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/gldis_secret
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_allow__all__imports: "true"
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── GLDIS API ─────────────────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database — PostgreSQL
      - DATABASE_URL=postgresql://gldis:gldis_secret@db:5432/gldis

      # OpenAI (pass from host shell: export OPENAI_API_KEY=sk-...)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1}

      # VLM (Qwen2.5-VL via LM Studio on host machine)
      # Set VLM_ENABLED=true if you have LM Studio running on the host
      - VLM_ENABLED=${VLM_ENABLED:-false}
      - VLM_MODEL=${VLM_MODEL:-qwen2.5-vl-7b-instruct}
      - VLM_API_BASE=http://host.docker.internal:1234/v1
      - VLM_CONFIDENCE_THRESHOLD=0.6

      # Neo4j (GraphRAG — Stage 2)
      - NEO4J_ENABLED=${NEO4J_ENABLED:-false}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=gldis_secret
      - GRAPHRAG_ENABLED=${GRAPHRAG_ENABLED:-false}

      # MinerU (optional Stage 1 layout bridge)
      - MINERU_ENABLED=${MINERU_ENABLED:-false}
      - MINERU_CLI_PATH=${MINERU_CLI_PATH:-magic-pdf}

      # DeepSeek-R1 (Stage 3 — reasoner model)
      - REASONING_API_BASE=${REASONING_API_BASE:-http://host.docker.internal:8001/v1}
      - REASONING_MODEL=${REASONING_MODEL:-deepseek-r1-distill-llama-70b}

      # Llama-4 (Stage 3 — verifier model)
      - VERIFIER_ENABLED=${VERIFIER_ENABLED:-false}
      - VERIFIER_API_BASE=${VERIFIER_API_BASE:-http://host.docker.internal:8002/v1}
      - VERIFIER_MODEL=${VERIFIER_MODEL:-llama-4-8b}

      # Storage
      - UPLOAD_DIR=/app/data/uploads
      - FAISS_INDEX_PATH=/app/data/faiss_index
      - BM25_INDEX_PATH=/app/data/bm25_index
      - FEEDBACK_STORE_PATH=/app/data/feedback

      # Redis (for future Celery)
      - REDIS_URL=redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
