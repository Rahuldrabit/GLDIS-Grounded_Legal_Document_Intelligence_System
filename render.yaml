services:
  - type: web
    name: gldis-backend
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:///./data/gldis.db
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_RATE_LIMIT_ENABLED
        value: "true"
      - key: LLM_RATE_LIMIT_REQUESTS
        value: "10"
      - key: LLM_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
